issuer: http://127.0.0.1:5556/dex

storage:
  type: memory

web:
  http: 0.0.0.0:5556

telemetry:
  http: 0.0.0.0:5558

oauth2:
  skipApprovalScreen: true
  passwordConnector: local

staticClients:
# Truster uses this client to delegate interactive user login to Dex.
- id: truster-interactive-e2e
  secret: truster-interactive-e2e-secret
  redirectURIs:
  - 'http://127.0.0.1:18080/callback/generic'
  name: 'Truster Interactive E2E'
# The static flow uses a distinct client so both policy sources are exercised.
- id: static-ci-token-exchange-e2e
  secret: static-ci-token-exchange-e2e-secret
  name: 'Static CI Token Exchange E2E'
# The database policy flow uses this client to obtain an external exchange token.
- id: db-ci-token-exchange-e2e
  secret: db-ci-token-exchange-e2e-secret
  name: 'Database Policy CI Token Exchange E2E'

connectors:
- type: mockCallback
  id: mock
  name: Mock

enablePasswordDB: true

staticPasswords:
- email: "test@example.com"
  hash: "$2a$10$sV/GfT4tjbAbWr0VITPPNeC7MPq8mQK95AE12PMbLDXn99dvqkNkS"
  username: "test"
  userID: "08a8684b-db88-4b73-90a9-3cd1661f5466"
