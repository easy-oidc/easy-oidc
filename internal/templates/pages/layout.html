{{define "layout"}}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{.Title}}</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
        background: #f5f5f5;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 20px;
      }

      main {
        background: white;
        border-radius: 12px;
        padding: 48px 64px;
        max-width: 600px;
        width: 100%;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }

      h1 {
        font-size: 36px;
        font-weight: 700;
        margin-bottom: 24px;
        color: #1a1a1a;
      }

      h2 {
        margin-bottom: 8px;
      }

      input:not([type="hidden"]):not([type="radio"]) {
        font: inherit;
        padding: 4px 6px;
      }

      button {
        font: inherit;
        padding: 4px 8px;
      }

      form > input:not([type="hidden"]):not([type="radio"]) ~ button {
        margin-left: 8px;
      }

      .otp-actions form {
        display: inline;
      }

      .otp-resend {
        appearance: none;
        background: none;
        border: 0;
        color: #1a1a1a;
        cursor: pointer;
        font: inherit;
        margin-left: 12px;
        padding: 0;
        text-decoration: underline;
      }

      p {
        font-size: 18px;
        line-height: 1.6;
        color: #333;
        margin-bottom: 16px;
      }

      p:last-child {
        margin-bottom: 0;
      }
    </style>
  </head>
  <body>
    <main>{{template "content" .}}</main>
  </body>
</html>
{{end}}
