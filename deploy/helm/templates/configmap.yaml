{{- include "truster.validateConfig" . }}
{{- if empty (trim .Values.config.existingConfigMap) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "truster.configMapName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "truster.labels" . | nindent 4 }}
data:
  config.jsonc: |
    {{- if not (empty (trim .Values.config.rawOverride)) }}
    {{- .Values.config.rawOverride | nindent 4 }}
    {{- else }}
    {{- include "truster.generatedConfig" . | nindent 4 }}
    {{- end }}
{{- end }}
