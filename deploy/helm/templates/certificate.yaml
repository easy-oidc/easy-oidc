{{- if .Values.server.tls.certManager.enabled }}
{{- include "truster.validateConfig" . }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "truster.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "truster.labels" . | nindent 4 }}
spec:
  secretName: {{ include "truster.serverTLSSecretName" . }}
  issuerRef:
    name: {{ .Values.server.tls.certManager.issuerRef.name | quote }}
    kind: {{ .Values.server.tls.certManager.issuerRef.kind | quote }}
    group: {{ .Values.server.tls.certManager.issuerRef.group | quote }}
  dnsNames:
    {{- toYaml .Values.server.tls.certManager.dnsNames | nindent 4 }}
  {{- with .Values.server.tls.certManager.duration }}
  duration: {{ . | quote }}
  {{- end }}
  {{- with .Values.server.tls.certManager.renewBefore }}
  renewBefore: {{ . | quote }}
  {{- end }}
{{- end }}
