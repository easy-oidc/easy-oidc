apiVersion: v1
kind: Service
metadata:
  name: {{ include "truster.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "truster.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: {{ ternary "https" "http" .Values.server.tls.enabled }}
      port: {{ .Values.service.port }}
      targetPort: web
      protocol: TCP
      appProtocol: {{ ternary "https" "http" .Values.server.tls.enabled }}
  selector:
    {{- include "truster.selectorLabels" . | nindent 4 }}
