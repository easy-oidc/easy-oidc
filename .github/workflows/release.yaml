name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  attestations: write
  contents: write
  id-token: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Validate semantic version tag
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          echo "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' || {
            echo "Release tag must be a semantic version such as v1.2.3" >&2
            exit 1
          }
          version="${RELEASE_TAG#v}"
          {
            echo "version=$version"
            echo "build_date=$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          } >> "$GITHUB_OUTPUT"
          echo "COMMIT_DATE=$(TZ=UTC git log -1 --format=%cd --date=format-local:'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Install pinned cross-compilers
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            gcc-13-aarch64-linux-gnu=13.3.0-6ubuntu2~24.04cross1 \
            libc6-dev-arm64-cross=2.39-0ubuntu8cross1

      - name: Validate release source
        run: |
          make precommit
          make test
          make build

      - name: Install Syft 1.42.3
        run: |
          curl --fail --location --silent --show-error \
            --output /tmp/syft.tar.gz \
            https://github.com/anchore/syft/releases/download/v1.42.3/syft_1.42.3_linux_amd64.tar.gz
          echo '0d6be741479eddd2c8644a288990c04f3df0d609bbc1599a005532a9dff63509  /tmp/syft.tar.gz' \
            | sha256sum --check
          sudo tar -xzf /tmp/syft.tar.gz -C /usr/local/bin syft
          syft version

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: v2.12.7
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish multi-architecture image
        id: image
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_DATE: ${{ steps.version.outputs.build_date }}
        run: |
          go install github.com/podplane/ocimage@v1
          go install github.com/google/go-containerregistry/cmd/crane@v0.20.6
          tags="ghcr.io/easy-oidc/easy-oidc:$VERSION"
          if [[ "$VERSION" != *-* ]]; then
            tags="$tags ghcr.io/easy-oidc/easy-oidc:latest"
          fi
          build_args=(
            "BUILD_VERSION=${{ github.ref_name }}"
            "BUILD_DATE=$BUILD_DATE"
            "COMMIT_HASH=${{ github.sha }}"
            "COMMIT_DATE=$COMMIT_DATE"
            "COMMIT_BRANCH=unknown"
          )
          for arch in amd64 arm64; do
            case "$arch" in
              amd64) cc=gcc ;;
              arm64) cc=aarch64-linux-gnu-gcc-13 ;;
            esac
            make build \
              "${build_args[@]}" \
              GOOS=linux \
              GOARCH="$arch" \
              CC="$cc" \
              BUILD_OUTPUT="bin/linux_$arch/easy-oidc" \
              BUILD_TAGS="netgo osusergo sqlite_omit_load_extension" \
              BUILD_EXTRA_LDFLAGS="-s -w -linkmode external -extldflags '-static'"
          done
          make image \
            "${build_args[@]}" \
            IMAGE_TAGS="$tags" \
            IMAGE_PUSH=true
          digest="$(crane digest "ghcr.io/easy-oidc/easy-oidc:$VERSION")"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Generate and attest image SBOMs
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/easy-oidc/easy-oidc"
          mkdir -p dist/image-sboms
          for arch in amd64 arm64; do
            digest="$(crane digest --platform "linux/$arch" "$image:$VERSION")"
            subject="$image@$digest"
            sbom="dist/image-sboms/easy-oidc_${VERSION}_linux_${arch}.spdx.json"
            syft "registry:$subject" --output "spdx-json=$sbom"
            cosign attest --yes --type spdxjson --predicate "$sbom" "$subject"
          done
          gh release upload "${{ github.ref_name }}" dist/image-sboms/*.spdx.json

      - name: Sign container image
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: cosign sign --yes "ghcr.io/easy-oidc/easy-oidc@${IMAGE_DIGEST}"

      - name: Attest container image
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-name: ghcr.io/easy-oidc/easy-oidc
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.18.5

      - name: Package and publish Helm chart
        id: chart
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          helm lint --strict deploy/helm --set config.existingConfigMap=easy-oidc-config
          mkdir -p dist/charts
          helm package deploy/helm \
            --version "$VERSION" \
            --app-version "$VERSION" \
            --destination dist/charts
          echo "$GH_TOKEN" | helm registry login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin
          helm push "dist/charts/easy-oidc-${VERSION}.tgz" \
            oci://ghcr.io/easy-oidc/charts
          cosign sign --yes "ghcr.io/easy-oidc/charts/easy-oidc:${VERSION}"
          syft "dir:deploy/helm" \
            --output "spdx-json=dist/charts/easy-oidc-${VERSION}.spdx.json"
          cosign sign-blob --yes \
            --bundle "dist/charts/easy-oidc-${VERSION}.tgz.bundle" \
            "dist/charts/easy-oidc-${VERSION}.tgz"
          gh release upload "${{ github.ref_name }}" \
            "dist/charts/easy-oidc-${VERSION}.tgz" \
            "dist/charts/easy-oidc-${VERSION}.tgz.bundle" \
            "dist/charts/easy-oidc-${VERSION}.spdx.json"
          echo "archive=dist/charts/easy-oidc-${VERSION}.tgz" >> "$GITHUB_OUTPUT"

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-checksums: dist/easy-oidc_${{ steps.version.outputs.version }}_checksums.txt

      - name: Attest Helm chart
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: ${{ steps.chart.outputs.archive }}

      - name: Publish attested release
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '')
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            })
            const release = releases.find(candidate => candidate.tag_name === tag)
            if (!release) {
              core.setFailed(`Draft release not found for ${tag}`)
              return
            }
            if (!release.draft) {
              core.setFailed(`Expected ${tag} to be a draft release`)
              return
            }
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.id,
              draft: false,
            })

  tf-modules:
    name: Publish changed TF modules
    needs: release
    uses: ./.github/workflows/release-tf.yml
    secrets: inherit
