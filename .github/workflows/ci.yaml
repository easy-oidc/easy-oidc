name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build and test
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres@sha256:6567bca8d7bc8c82c5922425a0baee57be8402df92bae5eacad5f01ae9544daa # 17.5-alpine
        env:
          POSTGRES_USER: easy_oidc_test
          POSTGRES_PASSWORD: easy_oidc_test
          POSTGRES_DB: easy_oidc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U easy_oidc_test -d easy_oidc_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Check formatting and lint
        run: make precommit

      - name: Test
        run: make test
        env:
          EASYOIDC_STATE_TEST_DB_URL: postgresql://easy_oidc_test:easy_oidc_test@localhost:5432/easy_oidc_test?sslmode=disable
          EASYOIDC_POLICY_TEST_DB_URL: postgresql://easy_oidc_test:easy_oidc_test@localhost:5432/easy_oidc_test?sslmode=disable

      - name: Upload coverage
        uses: codecov/codecov-action@5975040f7f7d40edaff8d784b576fd65ae95c073 # v5.5.5
        with:
          files: ./coverage.out

      - name: Build
        run: make build

  e2e:
    name: End-to-end test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      KUBECTL_VERSION: v1.33.2
      KUBELOGIN_VERSION: v1.36.2
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Install E2E tools
        run: |
          tool_dir="$RUNNER_TEMP/e2e-bin"
          mkdir -p "$tool_dir"
          curl -fsSL "https://dl.k8s.io/release/$KUBECTL_VERSION/bin/linux/amd64/kubectl" -o "$tool_dir/kubectl"
          checksum="$(curl -fsSL "https://dl.k8s.io/release/$KUBECTL_VERSION/bin/linux/amd64/kubectl.sha256")"
          echo "$checksum  $tool_dir/kubectl" | sha256sum --check
          chmod +x "$tool_dir/kubectl"
          GOBIN="$tool_dir" go install "github.com/int128/kubelogin@$KUBELOGIN_VERSION"
          ln -s kubelogin "$tool_dir/kubectl-oidc_login"
          echo "$tool_dir" >> "$GITHUB_PATH"

      - name: Test
        run: make e2e
        env:
          CONTAINER_CMD: docker
          E2E_HEADLESS: "true"
