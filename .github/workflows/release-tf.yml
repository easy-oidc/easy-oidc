name: Release TF Modules

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: tf-module-sync
  cancel-in-progress: false
  queue: max

jobs:
  sync:
    name: Publish changed TF modules
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          echo "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' || {
            echo "::error::Release tag must be a semantic version such as v1.2.3"
            exit 1
          }

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@592200bd4b9bbf4772ace78f887668b1e12f5c6a # v1.0.6
        with:
          tofu_version: 1.10.6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.12.2

      - name: Generate modules
        run: scripts/generate-tf-modules.sh "$RUNNER_TEMP/generated"

      - name: Validate AWS module
        working-directory: ${{ runner.temp }}/generated/aws
        run: |
          test -z "$(find . -type l -print)"
          tofu fmt -check -recursive
          tofu init -backend=false
          tofu validate
          tofu test

      - name: Validate Google module
        working-directory: ${{ runner.temp }}/generated/google
        run: |
          test -z "$(find . -type l -print)"
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate
          terraform test

      - name: Regenerate clean distribution trees
        run: scripts/generate-tf-modules.sh "$RUNNER_TEMP/generated"

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@67018539274d69449ef7c02e8e71183d1719ab42 # v2.1.4
        with:
          app-id: ${{ vars.TF_SYNC_APP_ID }}
          private-key: ${{ secrets.TF_SYNC_APP_KEY }}
          owner: easy-oidc
          repositories: terraform-aws-easy-oidc,terraform-google-easy-oidc
          permission-contents: write

      - name: Prepare and preflight distribution repositories
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -eu
          sync_root="$RUNNER_TEMP/tf-sync"
          mkdir -p "$sync_root"

          for provider in aws google; do
            repo="terraform-$provider-easy-oidc"
            destination="$sync_root/$repo"
            git clone --branch main --single-branch \
              "https://x-access-token:${GH_TOKEN}@github.com/easy-oidc/${repo}.git" "$destination"
            rsync -a --delete --exclude .git/ "$RUNNER_TEMP/generated/$provider/" "$destination/"
            git -C "$destination" add --all

            if git -C "$destination" diff --cached --quiet HEAD; then
              echo "No module changes to publish for $repo"
              continue
            fi

            tag_ref=$(git -C "$destination" ls-remote --tags origin \
              "refs/tags/$RELEASE_TAG")
            if test -n "$tag_ref"; then
              echo "::error::Tag $RELEASE_TAG already exists in $repo, but its main branch differs from the generated module"
              exit 1
            fi

            touch "$sync_root/$provider.publish"
          done

          for provider in aws google; do
            test -f "$sync_root/$provider.publish" || continue
            repo="terraform-$provider-easy-oidc"
            destination="$sync_root/$repo"
            git -C "$destination" config user.name "github-actions[bot]"
            git -C "$destination" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C "$destination" commit \
              -m "Sync easy-oidc/easy-oidc $RELEASE_TAG (${GITHUB_SHA::8})"
            git -C "$destination" tag --annotate "$RELEASE_TAG" \
              --message "Sync from easy-oidc/easy-oidc $RELEASE_TAG (${GITHUB_SHA::8})"
          done

      - name: Publish changed modules
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -eu
          sync_root="$RUNNER_TEMP/tf-sync"
          for provider in aws google; do
            test -f "$sync_root/$provider.publish" || continue
            repo="terraform-$provider-easy-oidc"
            destination="$sync_root/$repo"
            git -C "$destination" push --atomic origin \
              HEAD:refs/heads/main "refs/tags/$RELEASE_TAG"
            echo "Published $repo $RELEASE_TAG"
          done
